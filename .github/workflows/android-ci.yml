# Builds a debug APK on every push / pull request so each change can be
# installed and tested. The APK is attached to the workflow run as an artifact.
name: Build APK

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test & build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional repository *variables* (Settings > Secrets and variables > Actions > Variables).
      VITE_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      VITE_ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
      VITE_ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
      VITE_PEER_HOST: ${{ vars.PEER_HOST }}
      VITE_PEER_PORT: ${{ vars.PEER_PORT }}
      VITE_PEER_PATH: ${{ vars.PEER_PATH }}
      VITE_PEER_KEY: ${{ vars.PEER_KEY }}
      VITE_PRIVACY_URL: ${{ vars.PRIVACY_URL }}
      VITE_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npx vite build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/PolygonRush-debug-${SHORT_SHA}.apk"
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: polygon-rush-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
