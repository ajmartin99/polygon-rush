# Builds the signed release APK (for GitHub / sideloading) and AAB (for Google
# Play) and publishes them as a GitHub Release.
#
# Nothing here runs automatically on a normal push. A release only happens when
# the repository owner authorises it, by either:
#   * Actions > "Release" > Run workflow (enter the version, e.g. 1.0.0), or
#   * pushing a version tag:  git tag v1.0.0 && git push origin v1.0.0
#
# The job uses the "production" environment, so you can additionally require a
# manual approval: Settings > Environments > production > Required reviewers.
#
# Signing (strongly recommended - see docs/RELEASE.md):
#   secrets.ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   secrets.ANDROID_KEYSTORE_PASSWORD
#   secrets.ANDROID_KEY_ALIAS
#   secrets.ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key (installable for
# testing, not accepted by Google Play).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver, e.g. 1.0.0)'
        required: true
        default: '1.0.7'
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      VITE_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      VITE_ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
      VITE_ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
      VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      VITE_PEER_HOST: ${{ vars.PEER_HOST }}
      VITE_PEER_PORT: ${{ vars.PEER_PORT }}
      VITE_PEER_PATH: ${{ vars.PEER_PATH }}
      VITE_PEER_KEY: ${{ vars.PEER_KEY }}
      VITE_TURN_URL: ${{ vars.TURN_URL }}
      VITE_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
      VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
      VITE_PRIVACY_URL: ${{ vars.PRIVACY_URL }}
      VITE_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not semver (expected e.g. 1.0.0)"; exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::Minor and patch must be <= 99"; exit 1
          fi
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Releasing $VERSION (versionCode $CODE)"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "::error::Release v${{ steps.version.outputs.version }} already exists. Bump the version."; exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npx vite build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release keystore secrets found - the APK will be signed with a debug key (fine for testing, NOT for Google Play). See docs/RELEASE.md."
          fi

      - name: Build release APK + AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        id: files
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/PolygonRush-v${V}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/PolygonRush-v${V}.aab"
          (cd out && sha256sum *.apk *.aab > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "out/PolygonRush-v${V}.apk" > certs.txt
          head -n 5 certs.txt

      - name: Release notes
        run: |
          V="${{ steps.version.outputs.version }}"
          # Pull this version's section out of CHANGELOG.md.
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "Polygon Rush v${V}" > notes.md; fi
          {
            echo ""
            echo "### Downloads"
            echo "- **PolygonRush-v${V}.apk** - install directly on Android 7.0+ (enable *Install unknown apps*)."
            echo "- **PolygonRush-v${V}.aab** - upload to Google Play Console."
            echo "- **SHA256SUMS.txt** - checksums."
          } >> notes.md
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            {
              echo ""
              echo "> **Note:** this build is signed with a temporary debug key because no release keystore secrets were configured. It installs fine for testing but cannot be uploaded to Google Play or updated in place. See docs/RELEASE.md."
            } >> notes.md
          fi
          cat notes.md

      - uses: actions/upload-artifact@v6
        with:
          name: polygon-rush-v${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Polygon Rush v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ inputs.prerelease != true }}
          fail_on_unmatched_files: true
          files: |
            out/PolygonRush-v${{ steps.version.outputs.version }}.apk
            out/PolygonRush-v${{ steps.version.outputs.version }}.aab
            out/SHA256SUMS.txt
