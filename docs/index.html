<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polygon Rush</title>
    <meta name="description" content="Polygon Rush - an endless shape-shifting runner for all ages." />
    <style>
      :root { --bg: #1a1040; --ink: #f5f2ff; --soft: #c9c2ee; --accent: #ffd23f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; text-align: center; }
      img { max-width: 100%; height: auto; border-radius: 16px; }
      h1 { color: var(--accent); }
      a { color: var(--accent); }
      p { color: var(--soft); }
    </style>
  </head>
  <body>
    <main>
      <img src="feature-graphic.png" alt="Polygon Rush" width="1024" height="500" />
      <h1>Polygon Rush</h1>
      <p>Rush, jump, flip and fly through infinite polygon worlds — solo, against CPU rivals, with a friend on the same phone, or online with a room code.</p>
      <p><a href="https://github.com/ajmartin99/polygon-rush/releases">Download the latest release</a> · <a href="https://softgamebros.com/polygon-rush/privacy/">Privacy Policy</a></p>
    </main>
  </body>
</html>
