<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1040" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Polygon Rush - an endless shape-shifting runner for all ages." />
    <title>Polygon Rush</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Polygon Rush game view"></canvas>
      <div id="ui"></div>
      <div id="modals"></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="boot" class="boot" aria-label="Soft-Game Brothers, softgamebros.com">
        <div class="studio">
          <svg class="studio-mark" viewBox="0 0 34 34" aria-hidden="true">
            <rect class="sm-sq" x="2" y="14" width="14" height="14" rx="3" fill="#ffd23f" />
            <path class="sm-tri" d="M24 4 32 18H16Z" fill="#3ee6b0" />
            <circle class="sm-dot" cx="25" cy="26" r="6" fill="#ff6fae" />
          </svg>
          <div class="studio-name">Soft-Game Brothers</div>
          <div class="studio-url">softgamebros.com</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
